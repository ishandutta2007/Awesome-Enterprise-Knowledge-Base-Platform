<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.7" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#accentGrad);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e7ff;
    }
    .code-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      fill: #38bdf8;
    }
  </style>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Tech Grid Mesh -->
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.8">
    <animate attributeName="opacity" values="0.5;0.85;0.5" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Dynamic Background Ambient Pulsing Glow Orbs (Strictly in Background) -->
  <g opacity="0.7">
    <circle cx="200" cy="90" r="140" fill="url(#glowGrad1)">
      <animate attributeName="r" values="120;160;120" dur="8s" repeatCount="indefinite" />
      <animate attributeName="cx" values="180;220;180" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="120" r="160" fill="url(#glowGrad3)">
      <animate attributeName="r" values="140;180;140" dur="7s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;140;100" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="270" r="180" fill="url(#glowGrad2)">
      <animate attributeName="opacity" values="0.4;0.75;0.4" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Network Connection Nodes / Constellation Lines (Behind Text) -->
  <g stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="4,4">
    <line x1="80" y1="60" x2="280" y2="40">
      <animate attributeName="stroke-opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="920" y1="60" x2="1120" y2="90">
      <animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="90" y1="290" x2="240" y2="280" />
    <line x1="950" y1="280" x2="1110" y2="260" />
  </g>

  <!-- Subtle Dynamic Orbiting Knowledge Particles -->
  <g fill="#38bdf8">
    <circle cx="120" cy="70" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="280" cy="40" r="2.5">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1060" cy="80" r="3.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1120" cy="90" r="2.5">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="260" r="3">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Outer Neon Frame Border with Dynamic Glow Pulse -->
  <rect x="15" y="15" width="1170" height="310" rx="18" fill="none" stroke="url(#accentGrad)" stroke-width="1.8" stroke-opacity="0.4">
    <animate attributeName="stroke-opacity" values="0.3;0.75;0.3" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 68)" text-anchor="middle">
    <rect x="-160" y="-18" width="320" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.95" />
    <text y="4" class="code-pill" text-anchor="middle">✦ ENTERPRISE KNOWLEDGE INFRASTRUCTURE ✦</text>
  </g>

  <!-- FOREGROUND CONTENT: Prominent Main Title -->
  <text x="600" y="132" class="title-text" text-anchor="middle" filter="url(#dropShadow)">
    Awesome Enterprise Knowledge Base
  </text>

  <!-- FOREGROUND CONTENT: Clear Subtitle (Never Obscured) -->
  <text x="600" y="174" class="subtitle-text" text-anchor="middle">
    Curated Hub of Scalable Wikis, Internal Docs, SaaS Solutions &amp; Self-Hosted Open-Source Platforms
  </text>

  <!-- FOREGROUND CONTENT: Feature Highlights / Badges Bar -->
  <g transform="translate(600, 240)">
    <!-- Badge 1: SaaS & Hosted -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-22" width="170" height="42" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.4" opacity="0.92" filter="url(#dropShadow)" />
      <text x="0" y="5" class="badge-text" text-anchor="middle">🏢 Enterprise SaaS</text>
    </g>

    <!-- Badge 2: Open Source -->
    <g transform="translate(-120, 0)">
      <rect x="-85" y="-22" width="170" height="42" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.4" opacity="0.92" filter="url(#dropShadow)" />
      <text x="0" y="5" class="badge-text" text-anchor="middle">💻 Open-Source &amp; Self-Hosted</text>
    </g>

    <!-- Badge 3: AI & RAG -->
    <g transform="translate(120, 0)">
      <rect x="-85" y="-22" width="170" height="42" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.4" opacity="0.92" filter="url(#dropShadow)" />
      <text x="0" y="5" class="badge-text" text-anchor="middle">⚡ AI &amp; GenAI Search</text>
    </g>

    <!-- Badge 4: Pricing & TCO -->
    <g transform="translate(360, 0)">
      <rect x="-85" y="-22" width="170" height="42" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.4" opacity="0.92" filter="url(#dropShadow)" />
      <text x="0" y="5" class="badge-text" text-anchor="middle">📊 TCO &amp; Pricing Metrics</text>
    </g>
  </g>

  <!-- Dynamic Bottom Activity Wave Indicator (Below pills) -->
  <g opacity="0.6">
    <path d="M 300 295 Q 450 285 600 295 T 900 295" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="d" values="M 300 295 Q 450 285 600 295 T 900 295; M 300 295 Q 450 305 600 295 T 900 295; M 300 295 Q 450 285 600 295 T 900 295" dur="5s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
